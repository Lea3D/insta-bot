name: Check yt-dlp / gallery-dl for updates

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}    # manuell aus dem Actions-Tab startbar

permissions:
  contents: write
  actions: write           # nötig, um den Image-Build anzustoßen

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump pinned versions
        id: bump
        run: |
          changed=""
          for pkg in yt-dlp gallery-dl; do
            grep -q "^$pkg" requirements.txt || continue
            latest=$(curl -fsS "https://pypi.org/pypi/$pkg/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
            current=$(grep -oP "(?<=^$pkg==)\S+" requirements.txt || true)
            if [ "$latest" != "$current" ]; then
              sed -i "s/^$pkg\b.*/$pkg==$latest/" requirements.txt
              changed="$changed $pkg ${current:-unpinned}->$latest;"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: bump${{ steps.bump.outputs.changed }}"
          git push

      # Pushes mit dem GITHUB_TOKEN lösen keine anderen Workflows aus,
      # deshalb wird der Build explizit gestartet.
      - name: Trigger image build
        if: steps.bump.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref "${{ github.ref_name }}"
