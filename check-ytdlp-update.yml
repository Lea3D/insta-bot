name: Check yt-dlp for updates

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest yt-dlp version from PyPI
        id: latest
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Get currently pinned version
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=yt-dlp==)\S+' requirements.txt)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update requirements.txt
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          sed -i "s/yt-dlp==.*/yt-dlp==${{ steps.latest.outputs.version }}/" requirements.txt

      - name: Commit and push
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: bump yt-dlp ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          git push
